[project]
name = "hearth-brain"
version = "0.1.0"
description = "Local AI orchestration for Hearth (Ollama only, no cloud)"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "httpx>=0.27", "python-multipart>=0.0.9", "pypdf>=4.3"]

[project.optional-dependencies]
voice = ["faster-whisper>=1.0", "piper-tts>=1.3", "kokoro-onnx>=0.4", "numpy>=1.26"]
ocr = ["pytesseract>=0.3.10", "pillow>=10.4", "pypdfium2>=4.30"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
